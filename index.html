<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel de Agua del Tanque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        #container {
            width: 200px;
            height: 400px;
            border: 5px solid #000;
            position: relative;
            background-color: #cce7ff;
            border-radius: 10px;
            overflow: visible;
        }

        #water {
            width: 100%;
            position: absolute;
            bottom: 0;
            background-color: #007bff;
            transition: height 1s ease;
        }

        #percentage {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>

<div id="container">
    <div id="water" style="height: 0;"></div>
    <div id="percentage">0%</div>
</div>

<script>
    async function fetchWaterLevel() {
        try {
            const response = await fetch('/level'); // URL de tu API
            const data = await response.json();
            console.log(data);
            return data.level; // Se asume que la respuesta es un objeto con la propiedad "level"
        } catch (error) {
            console.error('Error al obtener el nivel de agua:', error);
            return 0; // En caso de error, regresa 0
        }
    }

    function updateWaterLevel(level) {
        const water = document.getElementById('water');
        const percentage = document.getElementById('percentage');
        const height = `${level}%`;

        water.style.height = height;
        percentage.textContent = height;
    }

    async function updateTank() {
        const level = await fetchWaterLevel();
        updateWaterLevel(level);
    }

    // Actualizar el tanque cada 5 segundos
    setInterval(updateTank, 3000);

    // Cargar la primera vez
    updateTank();
</script>

</body>
</html>
